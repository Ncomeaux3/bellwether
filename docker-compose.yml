services:
  bellwether:
    build: .
    container_name: bellwether
    restart: unless-stopped
    env_file: .env
    environment:
      BELLWETHER_DB: /data/bellwether.db
      # Untracked on purpose. web/public/data/*.json are tracked in git — that
      # is how the Mac publishes — so writing them from the container dirtied
      # tracked files on every run and made `git pull` fail every single day.
      # The container never publishes (no git credentials), so its export only
      # needs somewhere to land.
      BELLWETHER_EXPORT_DIR: /data/export
      TZ: America/Chicago
    volumes:
      # Mounted read-only so tsx's --env-file-if-exists finds it. Compose already
      # injects these vars via env_file; without the mount the CLI prints a
      # misleading "\.env not found" on every command.
      - ./.env:/app/.env:ro
      - ./data:/data
    # No entrypoint override here on purpose: the Dockerfile's
    # ENTRYPOINT ["pnpm","bw"] stays in force, so `docker compose run --rm
    # bellwether doctor` runs exactly `pnpm bw doctor` — the command
    # documented in README.md. `command` below only supplies the default
    # argument used by `docker compose up`; `docker compose run` replaces it
    # with whatever is passed on the CLI.
    command: ["start"]
    healthcheck:
      # Spec 6: report real pipeline health, not merely that the process exists.
      # Unhealthy until a step has succeeded in the last 26 hours.
      # Both sides go through datetime(): we store ISO 8601 with a 'T' and a
      # 'Z', SQLite's datetime() emits a space and no zone, and comparing the
      # two as raw strings makes 'T' > ' ' decide same-day ties — see the
      # identical guard (and the same comment) in src/workflow/collect.ts.
      # kind='collect' on purpose: `collect` is what the daily pipeline (`start`)
      # actually runs, so its freshness is what this check asserts. Without the
      # filter, a one-off manual `backfill` (including an over-budget refusal,
      # which still finishes ok) or `export` writes its own `ok` run row and
      # paints the container healthy for 26 hours while collect keeps failing.
      test: ["CMD", "node", "-e", "const D=require('better-sqlite3');const db=new D('/data/bellwether.db',{readonly:true});const r=db.prepare(\"SELECT COUNT(*) n FROM runs WHERE kind='collect' AND state='ok' AND datetime(ended_at) > datetime('now','-26 hours')\").get();process.exit(r.n>0?0:1)"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 1m
